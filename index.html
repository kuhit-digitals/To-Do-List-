<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do list app</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-right">
    <div class="logo-box">
    <img src="logo.png" class="logo">
 </div>
</div>
    <div class="bg-dots"></div>

    <div class="container">
       
         <div class="top-bar">
        <span id="taskCount">Tasks: 0</span>
        <button id="clearBtn">Clear All</button>
    </div>

    <h1>To-do List</h1>

    <div class="input-box">
        <input type="text" id="taskInput" placeholder="TODAY'S 🎯Goal ...">
        <button id="addBtn">Add</button>
    </div>

    <ul id="taskList"></ul>

    <h6 class="footer">Made with ❤️ by Harshit</h6>

</div>

    <script src="script.js"></script>

</body>
</html>
